[project]
name = "local-llm-inference-skeleton"
version = "0.1.0"
description = "Minimal extensible local LLM inference server (FastAPI + llama.cpp)"
authors = [ { name = "Your Name" } ]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime deps (mirrors requirements.txt)
dependencies = [
  "fastapi==0.114.1",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.4.0",
  "llama-cpp-python==0.2.90",
  "python-dotenv==1.0.1",
  "loguru==0.7.2",
  "sse-starlette==2.1.3",
  "requests==2.32.3",
  "huggingface-hub==0.24.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.5"
]
tokenizer = [
  "tiktoken==0.7.0"
]

[tool.uv]
# You can pin python version or platforms here if needed

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "llm", "config"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
