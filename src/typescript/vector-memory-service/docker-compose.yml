version: "3.8"

services:
  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: synccoreai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - synccoreai
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana (for Elasticsearch visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: synccoreai-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - synccoreai
    healthcheck:
      test: curl -s http://localhost:5601 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO (storage backend for Milvus)
  minio:
    image: minio/minio:RELEASE.2023-11-11T08-14-41Z
    container_name: synccoreai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    networks:
      - synccoreai
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 30s
      timeout: 20s
      retries: 3

  # etcd (metadata storage for Milvus)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: synccoreai-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - synccoreai
    healthcheck:
      test: etcdctl endpoint health
      interval: 30s
      timeout: 10s
      retries: 3

  # Milvus Vector Database
  milvus:
    image: milvusdb/milvus:v0.2.16
    container_name: synccoreai-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530" # gRPC API port
      - "9091:9091" # HTTP API port (metrics)
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - synccoreai
    healthcheck:
      test: curl -f http://localhost:9091/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (caching layer)
  redis:
    image: redis:7-alpine
    container_name: synccoreai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - synccoreai
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (for auxiliary data)
  postgres:
    image: postgres:15-alpine
    container_name: synccoreai-postgres
    environment:
      POSTGRES_USER: synccoreai
      POSTGRES_PASSWORD: synccoreai_password
      POSTGRES_DB: synccoreai_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - synccoreai
    healthcheck:
      test: pg_isready -U synccoreai
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ (message broker)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: synccoreai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - synccoreai
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  elasticsearch-data:
  minio-data:
  etcd-data:
  milvus-data:
  redis-data:
  postgres-data:
  rabbitmq-data:

networks:
  synccoreai:
    driver: bridge
